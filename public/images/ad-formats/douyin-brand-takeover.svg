<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F5F5F0"/>
  <rect x="290" y="20" width="220" height="460" rx="24" fill="#1A1A1A"/>
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#0A0A1A"/>
  <!-- Full screen brand visual -->
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#12122A"/>
  <!-- Brand visual -->
  <circle cx="400" cy="220" r="50" fill="rgba(255,255,255,0.06)" stroke="rgba(255,255,255,0.1)" stroke-width="1"/>
  <circle cx="400" cy="220" r="30" fill="rgba(255,255,255,0.08)"/>
  <text x="400" y="225" text-anchor="middle" fill="rgba(255,255,255,0.4)" font-family="Inter,system-ui,sans-serif" font-size="12">BRAND</text>
  <!-- Skip button -->
  <rect x="448" y="424" width="44" height="20" rx="10" fill="rgba(255,255,255,0.2)"/>
  <text x="470" y="438" text-anchor="middle" fill="rgba(255,255,255,0.7)" font-family="Inter,system-ui,sans-serif" font-size="9">Skip</text>
  <!-- Timer bar -->
  <rect x="298" y="44" width="102" height="3" rx="2" fill="#CC3333"/>
  <rect x="400" y="44" width="102" height="3" rx="2" fill="rgba(255,255,255,0.15)"/>
  <!-- Labels -->
  <text x="108" y="50" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500">Progress bar</text>
  <line x1="170" y1="46" x2="296" y2="46" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="108" y="220" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Full-screen static</text>
  <text x="108" y="238" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">or GIF, 3-5 seconds</text>
  <text x="108" y="256" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">One brand per day</text>
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">Brand Takeover</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Static or GIF at app open</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">3-5 seconds, exclusive</text>
  <text x="650" y="198" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">High impact, high cost</text>
</svg>