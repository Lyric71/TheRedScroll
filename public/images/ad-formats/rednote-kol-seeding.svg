  <!-- Note content -->
  <rect x="310" y="290" width="170" height="8" rx="2" fill="#1A1A1A" fill-opacity="0.6"/>
  <rect x="310" y="304" width="150" height="6" rx="2" fill="#1A1A1A" fill-opacity="0.3"/>
  <rect x="310" y="316" width="130" height="6" rx="2" fill="#1A1A1A" fill-opacity="0.3"/>
  <!-- Collaboration label -->
  <rect x="310" y="332" width="50" height="14" rx="4" fill="#CC3333" fill-opacity="0.1"/>
  <text x="335" y="342" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="7" font-weight="500">Collab</text>
  <!-- Engagement -->
  <rect x="310" y="356" width="180" height="28" rx="4" fill="#FAFAFA"/>
  <text x="345" y="374" text-anchor="middle" fill="#999" font-family="Inter,system-ui,sans-serif" font-size="9">2.4K</text>
  <text x="400" y="374" text-anchor="middle" fill="#999" font-family="Inter,system-ui,sans-serif" font-size="9">186</text>
  <text x="455" y="374" text-anchor="middle" fill="#999" font-family="Inter,system-ui,sans-serif" font-size="9">892</text>
  <!-- Labels -->
  <text x="108" y="250" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Product tag</text>
  <line x1="170" y1="246" x2="328" y2="242" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="108" y="340" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500">Collaboration label</text>
  <text x="108" y="356" text-anchor="middle" fill="#999" font-family="Inter,system-ui,sans-serif" font-size="10">Disclosed sponsorship</text>
  <line x1="170" y1="338" x2="308" y2="338" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">KOL Seeding</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Via Pugongying platform</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Organic-looking content</text>
  <text x="650" y="198" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Disclosed as collaboration</text>
