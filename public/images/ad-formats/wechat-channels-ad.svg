<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F5F5F0"/>
  <rect x="290" y="20" width="220" height="460" rx="24" fill="#1A1A1A"/>
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#000000"/>
  <!-- Channels video background -->
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#1A1A1A"/>
  <!-- Header -->
  <rect x="298" y="44" width="204" height="28" rx="16" fill="rgba(0,0,0,0.5)"/>
  <text x="400" y="62" text-anchor="middle" fill="rgba(255,255,255,0.8)" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="500">Channels</text>
  <!-- AD label -->
  <rect x="310" y="80" width="28" height="14" rx="3" fill="#CC3333" fill-opacity="0.9"/>
  <text x="324" y="90" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="500">Ad</text>
  <!-- Right sidebar -->
  <circle cx="488" cy="240" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="488" cy="280" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="488" cy="320" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Caption -->
  <rect x="310" y="380" width="130" height="7" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="310" y="394" width="100" height="6" rx="2" fill="rgba(255,255,255,0.35)"/>
  <!-- CTA -->
  <rect x="310" y="412" width="80" height="22" rx="4" fill="#09B83E"/>
  <text x="350" y="427" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="500">Learn more</text>
  <!-- Bottom nav -->
  <rect x="298" y="444" width="204" height="20" rx="0" fill="rgba(0,0,0,0.8)"/>
  <!-- Labels -->
  <text x="108" y="90" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Sponsored video</text>
  <text x="108" y="108" text-anchor="middle" fill="#999" font-family="Inter,system-ui,sans-serif" font-size="10">In Channels feed</text>
  <line x1="170" y1="87" x2="308" y2="87" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="108" y="300" text-anchor="middle" fill="#666" font-family="Inter,system-ui,sans-serif" font-size="11">Short-video format</text>
  <text x="108" y="316" text-anchor="middle" fill="#666" font-family="Inter,system-ui,sans-serif" font-size="11">Vertical, full-screen</text>
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">WeChat Channels Ad</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Video in short-video feed</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">CPM 2-13 RMB</text>
  <text x="650" y="198" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Less saturated than Moments</text>
</svg>