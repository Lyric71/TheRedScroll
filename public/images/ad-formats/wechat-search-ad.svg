<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F5F5F0"/>
  <!-- Phone frame -->
  <rect x="290" y="20" width="220" height="460" rx="24" fill="#1A1A1A"/>
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#FFFFFF"/>
  <!-- Status bar -->
  <rect x="298" y="44" width="204" height="28" rx="16" fill="#09B83E"/>
  <text x="400" y="62" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="500">WeChat</text>
  <!-- Search bar -->
  <rect x="310" y="80" width="180" height="28" rx="14" fill="#F0F0F0"/>
  <text x="400" y="98" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="9">Search</text>
  <!-- Search result - AD -->
  <rect x="310" y="118" width="180" height="72" rx="8" fill="#FFF8F0" stroke="#CC3333" stroke-width="1" stroke-opacity="0.3"/>
  <rect x="316" y="124" width="28" height="10" rx="2" fill="#CC3333" fill-opacity="0.15"/>
  <text x="330" y="132" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="7" font-weight="500">AD</text>
  <rect x="316" y="140" width="120" height="8" rx="2" fill="#1A1A1A" fill-opacity="0.7"/>
  <rect x="316" y="154" width="160" height="6" rx="2" fill="#1A1A1A" fill-opacity="0.2"/>
  <rect x="316" y="164" width="140" height="6" rx="2" fill="#1A1A1A" fill-opacity="0.2"/>
  <rect x="316" y="174" width="80" height="6" rx="2" fill="#1A1A1A" fill-opacity="0.15"/>
  <!-- Organic results -->
  <rect x="310" y="200" width="180" height="48" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="316" y="208" width="100" height="7" rx="2" fill="#1A1A1A" fill-opacity="0.5"/>
  <rect x="316" y="220" width="160" height="5" rx="2" fill="#1A1A1A" fill-opacity="0.15"/>
  <rect x="316" y="230" width="120" height="5" rx="2" fill="#1A1A1A" fill-opacity="0.15"/>
  <rect x="310" y="256" width="180" height="48" rx="6" fill="#FFFFFF" stroke="#E0E0E0" stroke-width="0.5"/>
  <rect x="316" y="264" width="110" height="7" rx="2" fill="#1A1A1A" fill-opacity="0.5"/>
  <rect x="316" y="276" width="160" height="5" rx="2" fill="#1A1A1A" fill-opacity="0.15"/>
  <rect x="316" y="286" width="130" height="5" rx="2" fill="#1A1A1A" fill-opacity="0.15"/>
  <!-- Labels -->
  <text x="108" y="160" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Sponsored result</text>
  <text x="108" y="178" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="10">Keyword-targeted</text>
  <line x1="170" y1="155" x2="308" y2="155" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="108" y="240" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">Organic results</text>
  <line x1="170" y1="235" x2="308" y2="235" stroke="#999" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3"/>
  <!-- Format label -->
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">WeChat Search Ad</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">CPC model</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Keyword-based targeting</text>
</svg>