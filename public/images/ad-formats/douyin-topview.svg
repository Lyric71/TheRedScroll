<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F5F5F0"/>
  <!-- Phone frame -->
  <rect x="290" y="20" width="220" height="460" rx="24" fill="#1A1A1A"/>
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#000000"/>
  <!-- Full screen takeover -->
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#1C1C2E"/>
  <!-- Brand logo area -->
  <circle cx="400" cy="200" r="32" fill="rgba(255,255,255,0.1)" stroke="rgba(255,255,255,0.2)" stroke-width="1"/>
  <text x="400" y="205" text-anchor="middle" fill="rgba(255,255,255,0.5)" font-family="Inter,system-ui,sans-serif" font-size="10">BRAND</text>
  <!-- Headline -->
  <rect x="340" y="250" width="120" height="10" rx="3" fill="rgba(255,255,255,0.7)"/>
  <rect x="355" y="268" width="90" height="7" rx="2" fill="rgba(255,255,255,0.35)"/>
  <!-- CTA -->
  <rect x="355" y="300" width="90" height="28" rx="14" fill="#CC3333"/>
  <text x="400" y="318" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="10" font-weight="500">Learn more</text>
  <!-- Skip indicator -->
  <rect x="448" y="56" width="40" height="16" rx="8" fill="rgba(255,255,255,0.2)"/>
  <text x="468" y="67" text-anchor="middle" fill="rgba(255,255,255,0.6)" font-family="Inter,system-ui,sans-serif" font-size="8">Skip</text>
  <!-- Timer -->
  <text x="316" y="67" fill="rgba(255,255,255,0.4)" font-family="Inter,system-ui,sans-serif" font-size="9">3s</text>
  <!-- Labels -->
  <text x="108" y="70" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">3-second countdown</text>
  <line x1="170" y1="65" x2="308" y2="65" stroke="#999" stroke-width="0.5" stroke-dasharray="3 3" opacity="0.3"/>
  <text x="108" y="260" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Full-screen takeover</text>
  <text x="108" y="278" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">First thing users see</text>
  <text x="108" y="294" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">at app open</text>
  <!-- Format label -->
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">Douyin TopView</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Full-screen at app open</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">3-60 seconds, autoplay</text>
  <text x="650" y="198" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Premium brand format</text>
</svg>