<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" fill="none">
  <rect width="800" height="500" rx="12" fill="#F5F5F0"/>
  <!-- Phone frame -->
  <rect x="290" y="20" width="220" height="460" rx="24" fill="#1A1A1A"/>
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#000000"/>
  <!-- Video background -->
  <rect x="298" y="44" width="204" height="420" rx="16" fill="#1A1A1A"/>
  <!-- Video content placeholder -->
  <rect x="298" y="44" width="204" height="420" rx="16" fill="url(#vid1)" opacity="0.3"/>
  <defs><linearGradient id="vid1" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#2A2A2A"/><stop offset="100%" stop-color="#0A0A0A"/></linearGradient></defs>
  <!-- AD label -->
  <rect x="310" y="56" width="28" height="14" rx="3" fill="#CC3333" fill-opacity="0.9"/>
  <text x="324" y="66" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="8" font-weight="500">Ad</text>
  <!-- Right sidebar icons -->
  <circle cx="488" cy="220" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="488" cy="260" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <circle cx="488" cy="300" r="14" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.3)" stroke-width="1"/>
  <!-- Bottom caption area -->
  <rect x="310" y="390" width="130" height="8" rx="2" fill="rgba(255,255,255,0.7)"/>
  <rect x="310" y="404" width="100" height="6" rx="2" fill="rgba(255,255,255,0.4)"/>
  <!-- CTA button -->
  <rect x="310" y="420" width="80" height="24" rx="12" fill="#CC3333"/>
  <text x="350" y="436" text-anchor="middle" fill="#FFFFFF" font-family="Inter,system-ui,sans-serif" font-size="9" font-weight="500">Shop now</text>
  <!-- Bottom nav -->
  <rect x="298" y="444" width="204" height="20" rx="0" fill="rgba(0,0,0,0.8)"/>
  <!-- Labels -->
  <text x="108" y="70" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="13" font-weight="500">Sponsored label</text>
  <line x1="170" y1="65" x2="308" y2="65" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <text x="108" y="300" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">Full-screen vertical</text>
  <text x="108" y="316" text-anchor="middle" fill="#666666" font-family="Inter,system-ui,sans-serif" font-size="11">video format</text>
  <text x="108" y="435" text-anchor="middle" fill="#CC3333" font-family="Inter,system-ui,sans-serif" font-size="12" font-weight="500">CTA button</text>
  <line x1="170" y1="432" x2="308" y2="432" stroke="#CC3333" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
  <!-- Format label -->
  <text x="650" y="140" text-anchor="middle" fill="#1A1A1A" font-family="Inter,system-ui,sans-serif" font-size="14" font-weight="500">Douyin In-Feed Ad</text>
  <text x="650" y="162" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Appears in For You feed</text>
  <text x="650" y="180" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">Up to 60 seconds</text>
  <text x="650" y="198" text-anchor="middle" fill="#999999" font-family="Inter,system-ui,sans-serif" font-size="11">E-commerce links supported</text>
</svg>