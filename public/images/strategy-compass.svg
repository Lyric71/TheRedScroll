<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" fill="none">
  <!-- Outer rings -->
  <circle cx="200" cy="200" r="170" stroke="#1A1A1A" stroke-width="2" fill="none"/>
  <circle cx="200" cy="200" r="150" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <circle cx="200" cy="200" r="130" stroke="#E8E0D8" stroke-width="0.75" fill="none"/>

  <!-- Major tick marks (N, E, S, W) -->
  <line x1="200" y1="30" x2="200" y2="70" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="370" y1="200" x2="330" y2="200" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="200" y1="370" x2="200" y2="330" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="30" y1="200" x2="70" y2="200" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Medium tick marks (NE, SE, SW, NW) -->
  <line x1="320" y1="80" x2="300" y2="100" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="320" y1="320" x2="300" y2="300" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="320" x2="100" y2="300" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="80" y1="80" x2="100" y2="100" stroke="#1A1A1A" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Minor tick marks — 30deg intervals -->
  <line x1="285" y1="44" x2="275" y2="61" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="356" y1="115" x2="339" y2="125" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="356" y1="285" x2="339" y2="275" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="285" y1="356" x2="275" y2="339" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="115" y1="356" x2="125" y2="339" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="285" x2="61" y2="275" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="44" y1="115" x2="61" y2="125" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="115" y1="44" x2="125" y2="61" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>

  <!-- Cardinal labels -->
  <text x="200" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#1A1A1A" letter-spacing="0.08em">N</text>
  <text x="310" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#1A1A1A" letter-spacing="0.08em">E</text>
  <text x="200" y="318" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#1A1A1A" letter-spacing="0.08em">S</text>
  <text x="90" y="206" text-anchor="middle" font-family="Inter, sans-serif" font-size="16" font-weight="500" fill="#1A1A1A" letter-spacing="0.08em">W</text>

  <!-- Cross-hairs — faint structural lines -->
  <line x1="200" y1="115" x2="200" y2="285" stroke="#E8E0D8" stroke-width="0.5"/>
  <line x1="115" y1="200" x2="285" y2="200" stroke="#E8E0D8" stroke-width="0.5"/>

  <!-- Ghost needles — dashed, multiple directions, showing indecision -->
  <line x1="200" y1="200" x2="175" y2="125" stroke="#5C5C5C" stroke-width="2" stroke-dasharray="6 5" opacity="0.35" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="255" y2="140" stroke="#5C5C5C" stroke-width="2" stroke-dasharray="6 5" opacity="0.25" stroke-linecap="round"/>
  <line x1="200" y1="200" x2="140" y2="155" stroke="#5C5C5C" stroke-width="2" stroke-dasharray="6 5" opacity="0.3" stroke-linecap="round"/>

  <!-- Center hub -->
  <circle cx="200" cy="200" r="8" fill="#E8E0D8"/>
  <circle cx="200" cy="200" r="4" fill="#5C5C5C"/>

  <!-- Question marks — bolder, more visible -->
  <text x="200" y="168" text-anchor="middle" font-family="Inter, sans-serif" font-size="28" font-weight="500" fill="#CC3333" opacity="0.7">?</text>
  <text x="248" y="215" text-anchor="middle" font-family="Inter, sans-serif" font-size="20" font-weight="500" fill="#5C5C5C" opacity="0.5">?</text>
  <text x="162" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="22" font-weight="500" fill="#5C5C5C" opacity="0.4">?</text>
</svg>
