<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <!-- Chat / interaction scene showing community activations -->

  <!-- Early access badge -->
  <rect x="10" y="10" width="120" height="50" rx="8" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <circle cx="35" cy="35" r="12" stroke="#CC3333" stroke-width="1.5" fill="none"/>
  <text x="35" y="39" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="500" fill="#CC3333">VIP</text>
  <line x1="55" y1="28" x2="115" y2="28" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="55" y1="38" x2="100" y2="38" stroke="#5C5C5C" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="55" y1="46" x2="85" y2="46" stroke="#E8E0D8" stroke-width="1.5" stroke-linecap="round"/>

  <!-- Q&A session bubble -->
  <rect x="150" y="10" width="120" height="65" rx="8" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <text x="165" y="30" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#5C5C5C" letter-spacing="0.05em">Q&amp;A SESSION</text>
  <!-- Question marks from audience -->
  <text x="170" y="52" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5C5C5C">?</text>
  <text x="190" y="48" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5C5C5C">?</text>
  <text x="210" y="55" font-family="Inter, sans-serif" font-size="14" font-weight="500" fill="#5C5C5C">?</text>
  <!-- Answer -->
  <path d="M230 38 L250 38 L250 58 L240 58 L235 65 L235 58 L230 58 Z" stroke="#CC3333" stroke-width="1.2" fill="none" stroke-linejoin="round"/>
  <line x1="235" y1="45" x2="246" y2="45" stroke="#CC3333" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="235" y1="52" x2="243" y2="52" stroke="#CC3333" stroke-width="1" stroke-linecap="round"/>

  <!-- Poll / feedback section -->
  <rect x="10" y="75" width="120" height="115" rx="8" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <text x="25" y="95" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#5C5C5C" letter-spacing="0.05em">FEEDBACK POLL</text>
  <!-- Poll bars -->
  <rect x="25" y="108" width="70" height="10" rx="4" fill="#1A1A1A" opacity="0.1"/>
  <rect x="25" y="108" width="55" height="10" rx="4" fill="#CC3333" opacity="0.35"/>
  <rect x="25" y="126" width="70" height="10" rx="4" fill="#1A1A1A" opacity="0.1"/>
  <rect x="25" y="126" width="35" height="10" rx="4" fill="#1A1A1A" opacity="0.2"/>
  <rect x="25" y="144" width="70" height="10" rx="4" fill="#1A1A1A" opacity="0.1"/>
  <rect x="25" y="144" width="48" height="10" rx="4" fill="#1A1A1A" opacity="0.2"/>
  <!-- Vote counts -->
  <text x="100" y="117" font-family="Inter, sans-serif" font-size="9" fill="#5C5C5C">62%</text>
  <text x="100" y="135" font-family="Inter, sans-serif" font-size="9" fill="#5C5C5C">24%</text>
  <text x="100" y="153" font-family="Inter, sans-serif" font-size="9" fill="#5C5C5C">14%</text>
  <!-- Checkmark on winner -->
  <path d="M112 110 L115 114 L122 106" stroke="#CC3333" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- UGC content challenge -->
  <rect x="150" y="90" width="120" height="100" rx="8" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <text x="165" y="110" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#5C5C5C" letter-spacing="0.05em">UGC CHALLENGE</text>
  <!-- Content tiles -->
  <rect x="165" y="120" width="32" height="32" rx="4" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <rect x="203" y="120" width="32" height="32" rx="4" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <rect x="165" y="158" width="32" height="22" rx="4" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <rect x="203" y="158" width="32" height="22" rx="4" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <!-- Play icon in first tile -->
  <polygon points="177,131 177,143 186,137" fill="#5C5C5C" opacity="0.4"/>
  <!-- Heart on second tile -->
  <path d="M219 128 C219 126.5 217.5 125 216 126.5 C214.5 125 213 126.5 213 128 C213 131 216 133 216 133 C216 133 219 131 219 128Z" fill="#CC3333" opacity="0.5"/>
  <!-- Image icon in third -->
  <circle cx="175" cy="164" r="2" fill="#5C5C5C" opacity="0.3"/>
  <polyline points="168,176 175,170 180,174 185,169 193,176" stroke="#5C5C5C" stroke-width="0.8" fill="none" opacity="0.4"/>
  <!-- Star on fourth -->
  <path d="M219 163 L220 166 L223 166 L221 168 L222 171 L219 169 L216 171 L217 168 L215 166 L218 166Z" fill="#CC3333" opacity="0.4"/>

  <!-- Connecting dotted lines showing interaction -->
  <line x1="70" y1="60" x2="70" y2="75" stroke="#5C5C5C" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="210" y1="75" x2="210" y2="90" stroke="#5C5C5C" stroke-width="1" stroke-dasharray="3 3"/>
</svg>
