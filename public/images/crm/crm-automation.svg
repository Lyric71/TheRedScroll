<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 200" fill="none">
  <!-- CRM automation flow: trigger → action → results -->

  <!-- Trigger column -->
  <rect x="10" y="20" width="75" height="160" rx="8" stroke="#E8E0D8" stroke-width="1.5" fill="none"/>
  <text x="48" y="40" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#5C5C5C" letter-spacing="0.05em">TRIGGERS</text>

  <!-- Trigger: 90 days inactive -->
  <rect x="20" y="52" width="55" height="28" rx="5" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <text x="48" y="64" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">90 days</text>
  <text x="48" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">inactive</text>

  <!-- Trigger: VIP tag -->
  <rect x="20" y="88" width="55" height="28" rx="5" stroke="#CC3333" stroke-width="1" fill="none"/>
  <text x="48" y="100" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#CC3333">VIP</text>
  <text x="48" y="110" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#CC3333">500 users</text>

  <!-- Trigger: Flash sale -->
  <rect x="20" y="124" width="55" height="28" rx="5" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <text x="48" y="136" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">Flash</text>
  <text x="48" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">sale</text>

  <!-- Arrows from triggers to automation engine -->
  <line x1="85" y1="66" x2="105" y2="90" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>
  <line x1="85" y1="102" x2="105" y2="100" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="85" y1="138" x2="105" y2="110" stroke="#5C5C5C" stroke-width="1" stroke-linecap="round"/>

  <!-- Automation engine — gear block -->
  <rect x="105" y="65" width="70" height="70" rx="10" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <!-- Gear icon inside -->
  <circle cx="140" cy="100" r="16" stroke="#1A1A1A" stroke-width="1.5" fill="none"/>
  <circle cx="140" cy="100" r="6" stroke="#1A1A1A" stroke-width="1" fill="none"/>
  <!-- Gear teeth -->
  <line x1="140" y1="82" x2="140" y2="78" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="140" y1="118" x2="140" y2="122" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="122" y1="100" x2="118" y2="100" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="158" y1="100" x2="162" y2="100" stroke="#1A1A1A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="129" y1="89" x2="126" y2="86" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="151" y1="111" x2="154" y2="114" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="129" y1="111" x2="126" y2="114" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <line x1="151" y1="89" x2="154" y2="86" stroke="#1A1A1A" stroke-width="2" stroke-linecap="round"/>
  <!-- Auto label -->
  <text x="140" y="80" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" font-weight="500" fill="#5C5C5C" letter-spacing="0.05em">AUTO</text>

  <!-- Output arrows -->
  <line x1="175" y1="85" x2="195" y2="50" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="175" y1="100" x2="195" y2="100" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="175" y1="115" x2="195" y2="150" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Arrowheads -->
  <polyline points="191,46 195,50 191,54" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="191,96 195,100 191,104" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <polyline points="191,146 195,150 191,154" stroke="#CC3333" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Output: Message sent -->
  <rect x="198" y="30" width="72" height="40" rx="6" stroke="#E8E0D8" stroke-width="1.2" fill="none"/>
  <!-- Envelope icon -->
  <rect x="215" y="40" width="20" height="14" rx="2" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <polyline points="215,40 225,49 235,40" stroke="#5C5C5C" stroke-width="1" fill="none"/>
  <text x="234" y="60" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">Sent</text>

  <!-- Output: Offer pushed -->
  <rect x="198" y="80" width="72" height="40" rx="6" stroke="#E8E0D8" stroke-width="1.2" fill="none"/>
  <text x="234" y="98" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#CC3333">20% OFF</text>
  <text x="234" y="112" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">Exclusive</text>

  <!-- Output: Conversion tracking -->
  <rect x="198" y="130" width="72" height="50" rx="6" stroke="#E8E0D8" stroke-width="1.2" fill="none"/>
  <text x="234" y="146" text-anchor="middle" font-family="Inter, sans-serif" font-size="8" fill="#5C5C5C">Conversions</text>
  <!-- Mini bar chart -->
  <rect x="212" y="162" width="8" height="10" rx="1" fill="#E8E0D8"/>
  <rect x="224" y="156" width="8" height="16" rx="1" fill="#5C5C5C" opacity="0.4"/>
  <rect x="236" y="152" width="8" height="20" rx="1" fill="#CC3333" opacity="0.5"/>
  <rect x="248" y="148" width="8" height="24" rx="1" fill="#CC3333" opacity="0.7"/>

  <!-- "Runs itself" indicator -->
  <text x="140" y="155" text-anchor="middle" font-family="Inter, sans-serif" font-size="9" font-weight="500" fill="#5C5C5C" opacity="0.5" letter-spacing="0.03em">No manual input</text>
</svg>
