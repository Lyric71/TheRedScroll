<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none">
  <!-- AI draft document (left) -->
  <rect x="32" y="20" width="180" height="200" rx="8" fill="#F7F2EE"/>
  <rect x="44" y="32" width="60" height="20" rx="4" fill="#CC3333" opacity="0.12"/>
  <rect x="52" y="39" width="44" height="6" rx="1" fill="#CC3333" opacity="0.5"/>

  <!-- Chinese text lines -->
  <rect x="44" y="64" width="156" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="78" width="140" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="92" width="152" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="106" width="120" height="7" rx="2" fill="#D0C8C0"/>

  <!-- Divider -->
  <line x1="44" y1="124" x2="200" y2="124" stroke="#E8E0D8" stroke-width="1"/>

  <!-- English text lines -->
  <rect x="44" y="136" width="148" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="150" width="132" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="164" width="156" height="7" rx="2" fill="#D0C8C0"/>
  <rect x="44" y="178" width="100" height="7" rx="2" fill="#D0C8C0"/>

  <!-- Cursor blink -->
  <rect x="100" y="177" width="2" height="10" fill="#CC3333" opacity="0.6"/>

  <!-- Arrow from AI to human -->
  <line x1="228" y1="120" x2="264" y2="120" stroke="#CC3333" stroke-width="2" opacity="0.3" stroke-dasharray="4 3"/>
  <polygon points="264,115 274,120 264,125" fill="#CC3333" opacity="0.3"/>

  <!-- Human-edited document (right) -->
  <rect x="280" y="20" width="180" height="200" rx="8" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1.5"/>
  <rect x="292" y="32" width="72" height="20" rx="4" fill="#F7F2EE"/>
  <rect x="300" y="39" width="56" height="6" rx="1" fill="#B0A898"/>

  <!-- Edited Chinese text with corrections -->
  <rect x="292" y="64" width="156" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>
  <rect x="292" y="78" width="140" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>
  <rect x="292" y="92" width="120" height="7" rx="2" fill="#CC3333" opacity="0.2"/>
  <rect x="292" y="106" width="148" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>

  <!-- Edit marks -->
  <line x1="292" y1="95" x2="412" y2="95" stroke="#CC3333" stroke-width="1" opacity="0.3"/>
  <rect x="292" y="102" width="132" height="7" rx="2" fill="#CC3333" opacity="0.15"/>

  <line x1="292" y1="124" x2="448" y2="124" stroke="#E8E0D8" stroke-width="1"/>

  <!-- Edited English -->
  <rect x="292" y="136" width="148" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>
  <rect x="292" y="150" width="132" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>
  <rect x="292" y="164" width="156" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>
  <rect x="292" y="178" width="108" height="7" rx="2" fill="#1A1A1A" opacity="0.6"/>

  <!-- Approval checkmark -->
  <circle cx="440" cy="36" r="12" fill="#CC3333" opacity="0.12"/>
  <polyline points="433,36 438,41 448,31" stroke="#CC3333" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5" fill="none"/>
</svg>