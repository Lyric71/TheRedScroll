<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none">
  <!-- AI generation interface panel -->
  <rect x="24" y="16" width="200" height="208" rx="8" fill="#F7F2EE"/>

  <!-- Toolbar -->
  <rect x="36" y="28" width="176" height="24" rx="4" fill="#FFFFFF"/>
  <circle cx="52" cy="40" r="5" fill="#CC3333" opacity="0.6"/>
  <circle cx="68" cy="40" r="5" fill="#D0C8C0"/>
  <rect x="100" y="36" width="60" height="8" rx="2" fill="#E8E0D8"/>
  <rect x="176" y="34" width="28" height="12" rx="3" fill="#CC3333" opacity="0.15"/>

  <!-- Prompt input -->
  <rect x="36" y="62" width="176" height="36" rx="4" fill="#FFFFFF"/>
  <rect x="48" y="72" width="120" height="6" rx="2" fill="#D0C8C0"/>
  <rect x="48" y="84" width="80" height="6" rx="2" fill="#D0C8C0"/>

  <!-- Generating indicator -->
  <rect x="36" y="108" width="176" height="4" rx="2" fill="#E8E0D8"/>
  <rect x="36" y="108" width="132" height="4" rx="2" fill="#CC3333" opacity="0.4"/>

  <!-- Settings sliders -->
  <rect x="48" y="124" width="60" height="6" rx="2" fill="#D0C8C0"/>
  <rect x="36" y="136" width="120" height="4" rx="2" fill="#E8E0D8"/>
  <circle cx="120" cy="138" r="5" fill="#CC3333" opacity="0.35"/>

  <rect x="48" y="152" width="48" height="6" rx="2" fill="#D0C8C0"/>
  <rect x="36" y="164" width="120" height="4" rx="2" fill="#E8E0D8"/>
  <circle cx="96" cy="166" r="5" fill="#CC3333" opacity="0.35"/>

  <!-- Generate button -->
  <rect x="36" y="184" width="176" height="28" rx="6" fill="#CC3333" opacity="0.15"/>
  <rect x="80" y="194" width="88" height="8" rx="2" fill="#CC3333" opacity="0.5"/>

  <!-- Output: Generated product images -->
  <rect x="248" y="16" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
  <rect x="260" y="28" width="76" height="60" rx="4" fill="#F7F2EE"/>
  <rect x="285" y="38" width="26" height="40" rx="4" fill="#E0D8D0"/>
  <rect x="290" y="34" width="16" height="10" rx="2" fill="#D8D0C8"/>
  <circle cx="298" cy="62" r="8" fill="#D0C8C0" opacity="0.5"/>
  <rect x="264" y="94" width="48" height="5" rx="1" fill="#D0C8C0"/>

  <rect x="360" y="16" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
  <rect x="372" y="28" width="76" height="60" rx="4" fill="#F7F2EE"/>
  <circle cx="410" cy="50" r="14" fill="#E0D8D0"/>
  <rect x="396" y="64" width="28" height="18" rx="3" fill="#D8D0C8"/>
  <rect x="376" y="94" width="56" height="5" rx="1" fill="#D0C8C0"/>

  <rect x="248" y="128" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#E8E0D8" stroke-width="1"/>
  <rect x="260" y="140" width="76" height="60" rx="4" fill="#F7F2EE"/>
  <rect x="274" y="150" width="48" height="36" rx="6" fill="#E0D8D0"/>
  <rect x="290" y="146" width="16" height="10" rx="2" fill="#D8D0C8"/>
  <rect x="264" y="206" width="40" height="5" rx="1" fill="#D0C8C0"/>

  <!-- Video output with play button -->
  <rect x="360" y="128" width="100" height="100" rx="8" fill="#FFFFFF" stroke="#CC3333" stroke-width="1.5" opacity="0.4"/>
  <rect x="372" y="140" width="76" height="60" rx="4" fill="#F7F2EE"/>
  <circle cx="410" cy="170" r="14" fill="#CC3333" opacity="0.12"/>
  <polygon points="405,163 405,177 418,170" fill="#CC3333" opacity="0.4"/>
  <rect x="376" y="206" width="52" height="5" rx="1" fill="#D0C8C0"/>

  <!-- Sparkle accent -->
  <circle cx="340" cy="120" r="3" fill="#CC3333" opacity="0.3"/>
  <line x1="340" y1="114" x2="340" y2="126" stroke="#CC3333" stroke-width="1" opacity="0.2"/>
  <line x1="334" y1="120" x2="346" y2="120" stroke="#CC3333" stroke-width="1" opacity="0.2"/>
</svg>