<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 240" fill="none">
  <!-- Central radar/pulse visualization -->
  <circle cx="240" cy="120" r="100" fill="none" stroke="#E8E0D8" stroke-width="1.5"/>
  <circle cx="240" cy="120" r="70" fill="none" stroke="#E8E0D8" stroke-width="1.5"/>
  <circle cx="240" cy="120" r="40" fill="none" stroke="#E8E0D8" stroke-width="1.5"/>
  <circle cx="240" cy="120" r="12" fill="#CC3333" opacity="0.2"/>
  <circle cx="240" cy="120" r="6" fill="#CC3333" opacity="0.5"/>

  <!-- Radar sweep -->
  <path d="M240,120 L240,20" stroke="#CC3333" stroke-width="2" opacity="0.3"/>
  <path d="M240,120 L310,50" stroke="#CC3333" stroke-width="1.5" opacity="0.15"/>
  <path d="M240,120 L240,20 A100,100 0 0,1 310,50 Z" fill="#CC3333" opacity="0.05"/>

  <!-- Platform dots on radar -->
  <!-- WeChat -->
  <circle cx="205" cy="78" r="8" fill="#F7F2EE" stroke="#D0C8C0" stroke-width="1.5"/>
  <rect x="199" y="75" width="12" height="6" rx="1" fill="#D0C8C0"/>
  <!-- Douyin -->
  <circle cx="290" cy="90" r="8" fill="#F7F2EE" stroke="#D0C8C0" stroke-width="1.5"/>
  <rect x="286" y="88" width="8" height="4" rx="1" fill="#D0C8C0"/>
  <!-- RedNote -->
  <circle cx="270" cy="155" r="8" fill="#F7F2EE" stroke="#CC3333" stroke-width="1.5" opacity="0.6"/>
  <rect x="264" y="153" width="12" height="4" rx="1" fill="#CC3333" opacity="0.4"/>
  <!-- Weibo -->
  <circle cx="190" cy="145" r="8" fill="#F7F2EE" stroke="#D0C8C0" stroke-width="1.5"/>
  <rect x="184" y="143" width="12" height="4" rx="1" fill="#D0C8C0"/>

  <!-- Alert badges -->
  <circle cx="295" cy="85" r="4" fill="#CC3333" opacity="0.7"/>
  <circle cx="275" cy="150" r="4" fill="#CC3333" opacity="0.7"/>

  <!-- Left: Trend feed -->
  <rect x="24" y="32" width="120" height="24" rx="4" fill="#F7F2EE"/>
  <rect x="36" y="41" width="48" height="6" rx="2" fill="#CC3333" opacity="0.3"/>
  <rect x="90" y="41" width="40" height="6" rx="2" fill="#D0C8C0"/>

  <rect x="24" y="64" width="120" height="20" rx="4" fill="#F7F2EE"/>
  <rect x="36" y="71" width="60" height="6" rx="2" fill="#D0C8C0"/>
  <rect x="24" y="92" width="120" height="20" rx="4" fill="#F7F2EE"/>
  <rect x="36" y="99" width="52" height="6" rx="2" fill="#D0C8C0"/>
  <rect x="24" y="120" width="120" height="20" rx="4" fill="#F7F2EE"/>
  <rect x="36" y="127" width="72" height="6" rx="2" fill="#D0C8C0"/>

  <!-- Right: Sentiment indicators -->
  <rect x="370" y="48" width="88" height="32" rx="6" fill="#F7F2EE"/>
  <circle cx="388" cy="64" r="6" fill="#CC3333" opacity="0.25"/>
  <rect x="400" y="58" width="44" height="5" rx="1" fill="#D0C8C0"/>
  <rect x="400" y="67" width="32" height="5" rx="1" fill="#CC3333" opacity="0.2"/>

  <rect x="370" y="92" width="88" height="32" rx="6" fill="#F7F2EE"/>
  <circle cx="388" cy="108" r="6" fill="#D0C8C0"/>
  <rect x="400" y="102" width="40" height="5" rx="1" fill="#D0C8C0"/>
  <rect x="400" y="111" width="48" height="5" rx="1" fill="#D0C8C0"/>

  <rect x="370" y="136" width="88" height="32" rx="6" fill="#F7F2EE"/>
  <circle cx="388" cy="152" r="6" fill="#CC3333" opacity="0.15"/>
  <rect x="400" y="146" width="36" height="5" rx="1" fill="#D0C8C0"/>
  <rect x="400" y="155" width="44" height="5" rx="1" fill="#D0C8C0"/>

  <!-- Pulse rings emanating -->
  <circle cx="270" cy="155" r="16" fill="none" stroke="#CC3333" stroke-width="1" opacity="0.2"/>
  <circle cx="270" cy="155" r="24" fill="none" stroke="#CC3333" stroke-width="0.75" opacity="0.1"/>
</svg>